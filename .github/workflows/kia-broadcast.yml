name: KIA Tigers Broadcast Bot

on:
  push:
    branches:
      - main
    paths:
      - ".github/manual-kia-send"
  schedule:
    # Start several non-busy-minute anchors early; the first one waits for 10:00 KST.
    - cron: "17,47 8-9 * * *"
      timezone: "Asia/Seoul"
    # Continue checking every 30 minutes away from the busy :00/:30 boundaries.
    - cron: "17,47 10-23 * * *"
      timezone: "Asia/Seoul"
  workflow_dispatch:

concurrency:
  group: kia-broadcast-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      TZ: Asia/Seoul
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      SEND_NO_GAME: ${{ secrets.SEND_NO_GAME }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install KIA bot dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate KIA bot secrets
        run: |
          python - <<'PY'
          import os

          required = ("TELEGRAM_BOT_TOKEN", "TELEGRAM_CHAT_ID")
          missing = [name for name in required if not os.environ.get(name, "").strip()]
          if missing:
              raise SystemExit(f"Missing required secrets: {', '.join(missing)}")
          print("Required KIA bot secrets are configured.")
          PY

      - name: Run KIA tests
        continue-on-error: true
        run: pytest -q tests/test_parser.py tests/test_webhook.py tests/test_schedule_window.py

      - name: Wait for 10:00 KST notification window
        id: notification_window
        if: github.event_name == 'schedule'
        shell: bash
        run: python scripts/wait_for_first_check.py >> "$GITHUB_OUTPUT"

      - name: Run bot
        if: github.event_name != 'schedule' || steps.notification_window.outputs.run == 'true'
        run: python src/kia_broadcast_bot.py

      - name: Commit state changes
        if: github.event_name != 'schedule' || steps.notification_window.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -d .bot_state ]; then
            git add .bot_state/kia_*.json 2>/dev/null || true
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Update KIA broadcast bot state"
            for attempt in 1 2 3; do
              if git push; then
                exit 0
              fi
              echo "Push failed; rebasing and retrying ($attempt/3)."
              git fetch origin main
              git rebase origin/main
            done
            exit 1
          else
            echo "No state changes to commit."
          fi
